name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Generate canonical v1 receipt
        if: matrix.python-version == '3.11'
        run: python experiments/run_v1.py --seeds 16 --out /tmp/v1.json
      - name: Upload canonical v1 receipt
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: v1-receipt
          path: /tmp/v1.json
      - name: Unit and invariant tests
        run: pytest -q
      - name: Pages JavaScript syntax
        run: node --check site.js
      - name: Scientific smoke run
        run: python experiments/run_v0.py --seeds 4 --out /tmp/v0-smoke.json
