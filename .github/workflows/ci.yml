name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Generate canonical v0 receipt
        if: matrix.python-version == '3.11'
        run: python experiments/run_v0.py --seeds 16 --out /tmp/v0.json
      - name: Upload canonical v0 receipt
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: v0-receipt
          path: /tmp/v0.json
      - name: Tests
        run: pytest -q
