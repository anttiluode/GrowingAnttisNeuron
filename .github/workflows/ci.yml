name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit and invariant tests
        run: pytest -q
      - name: Pages JavaScript syntax
        run: node --check site.js
      - name: v0 scientific smoke run
        run: python experiments/run_v0.py --seeds 4 --out /tmp/v0-smoke.json
      - name: v1 scientific smoke run
        run: python experiments/run_v1.py --seeds 4 --out /tmp/v1-smoke.json
      - name: v2 scientific smoke run
        run: python experiments/run_v2.py --seeds 4 --out /tmp/v2-smoke.json
      - name: v3 scientific smoke run
        run: python experiments/run_v3.py --out /tmp/v3-smoke.json && cat /tmp/v3-smoke.json
