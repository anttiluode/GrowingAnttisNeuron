[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "growing-anttis-neuron"
version = "0.1.0"
description = "Developmental testbed for growing AnttisNeuron operators"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["growing_anttis_neuron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
